; ============================================================================
; Watchizer — Laravel queue worker (Supervisor program)
; Install:
;   sudo cp supervisor-worker.conf /etc/supervisor/conf.d/
;   sudo supervisorctl reread && sudo supervisorctl update
;   sudo supervisorctl start watchizer-worker:*
; ============================================================================
[program:watchizer-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /home/u591083448/watchizer/backend/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=u591083448
numprocs=1
redirect_stderr=true
stdout_logfile=/home/u591083448/watchizer/backend/storage/logs/worker.log
stopwaitsecs=3600
