; ============================================================================
; Watchizer — recommended production PHP settings.
; Reference copy. On Hostinger apply these via:
;   hPanel → Advanced → PHP Configuration
; or via public/.user.ini (already provided in this repo).
; ============================================================================

memory_limit = 512M
max_execution_time = 120
upload_max_filesize = 10M
post_max_size = 12M
max_input_vars = 3000
