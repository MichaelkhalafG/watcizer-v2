# FLAT node_modules (2026-10-11). Hostinger builds a STANDALONE server, and standalone output only
# creates top-level links for packages Next traces as static dependencies. Next 15.5 loads `sharp` with
# a runtime `require('sharp')` inside the image optimiser, so under pnpm's default isolated layout the
# packages were copied into .pnpm/ with NO resolvable `node_modules/sharp` — every /_next/image answered
# with the untouched original ("Cannot find module 'sharp'" on the host, backlog PERF-IMG). Hoisted
# installs real directories, so `node_modules/sharp` exists in the standalone output. The lockfile does
# not change. Measured on a scratch copy: standalone `require('sharp')` OK, /logo.webp 141,944 B → 5,856 B
# AVIF at w=256. To undo: delete this line (and the include in next.config.js) and rebuild.
nodeLinker: hoisted

allowBuilds:
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@next/env@15.5.27'
  - '@next/swc-darwin-arm64@15.5.27'
  - '@next/swc-darwin-x64@15.5.27'
  - '@next/swc-linux-arm64-gnu@15.5.27'
  - '@next/swc-linux-arm64-musl@15.5.27'
  - '@next/swc-linux-x64-gnu@15.5.27'
  - '@next/swc-linux-x64-musl@15.5.27'
  - '@next/swc-win32-arm64-msvc@15.5.27'
  - '@next/swc-win32-x64-msvc@15.5.27'
  - next@15.5.27

# Security overrides (transitive deps pulled in by next / eslint). pnpm 11 reads
# overrides from here, not the package.json "pnpm" field. Ranges stay within the
# same major / 0.x line so nothing jumps a major version.
overrides:
  sharp: "^0.35.4" # <0.35.0 → libvips CVEs; 0.35.4 bundles libheif 1.23.2, which Next 15.5.2x requires before it will optimise an AVIF SOURCE (isAvifDecodeSafe)
  postcss: "^8.5.18" # <=8.5.17 → 3 advisories
  # brace-expansion: BOTH lines now have patched releases (2026-10-01) — CVE-2026-102276/-102277/
  # -102278 (DoS: recursion on nested braces, recursion in parseCommaParts, quadratic expansion).
  # 1.1.21 and 5.0.12 cover all three. Each line keeps its own major: 5.x exports a named
  # { expand } while minimatch@3 (eslint → @eslint/config-array) calls require('brace-expansion')()
  # — forcing 5.x onto it throws "expand is not a function" and crashes ESLint.
  # Reachability: devDependencies only (eslint → minimatch@3 / @typescript-eslint → minimatch@10);
  # `pnpm why brace-expansion --prod` is empty, and Next's own vendored copy (compiled glob /
  # @vercel/nft) runs at build time. The DoS was against the build machine, never the storefront.
  "brace-expansion@1": "^1.1.21"
  "brace-expansion@5": "^5.0.12"
  # follow-redirects: CVE-2026-111755 / CVE-2026-111756 (both High, published 2026-10-20) in 1.16.0, fixed in
  # 1.16.1. Transitive only - axios@1.20.0 declares ^1.16.0 - and Node-side only (the browser follows its own
  # redirects): the exposed client is serverFetch.js, which sends the secret X-Storefront-Server-Key and follows
  # redirects by default, so a cross-origin 3xx from the Laravel origin would carry it. The origin issues none in
  # normal operation; the override is so a FRESH install can never resolve the vulnerable line again.
  follow-redirects: ">=1.16.1"

patchedDependencies:
  '@react-three/fiber@9.6.1': patches/@react-three__fiber@9.6.1.patch
