allowBuilds:
  sharp: true
  unrs-resolver: true

# Security overrides (transitive deps pulled in by next / eslint). pnpm 11 reads
# overrides from here, not the package.json "pnpm" field. Ranges stay within the
# same major / 0.x line so nothing jumps a major version.
overrides:
  sharp: "^0.35.0"                # <0.35.0 → inherited libvips CVEs
  postcss: "^8.5.18"              # <=8.5.17 → 3 advisories
  # brace-expansion 1.x is pinned to the newest 1.x (1.1.18). NOTE: CVE-2026-14257
  # (ReDoS/DoS) also affects 1.1.18 and the 1.x line has NO patched release — the
  # only "fix" is 5.x. We do NOT force 5.x here: brace-expansion 5.x changed from a
  # default function export to a named { expand } export, and minimatch@3 (pulled
  # by eslint → @eslint/config-array) does `require('brace-expansion')()`, so 5.x
  # throws "TypeError: expand is not a function" and crashes ESLint. This path is
  # build/lint-time only (devDependency, not in the runtime bundle) and only ever
  # sees trusted glob patterns from ESLint config, so the DoS is not reachable.
  # Accepted risk; revisit if eslint/minimatch update to a patched brace-expansion.
  "brace-expansion@1": "^1.1.17"
  "brace-expansion@5": "^5.0.8"   # >=4.0.0 <5.0.8 on the 5.x line
